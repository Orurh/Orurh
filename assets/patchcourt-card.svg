<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
<title id="title">PatchCourt — architecture impact of a C++ patch</title><desc id="desc">Compare architectural dependency edges before and after a code patch. Distinguish introduced risk, removed risk, and existing technical debt.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#edf5ff"/></linearGradient><filter id="shade" x="-15%" y="-15%" width="145%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#173858" flood-opacity=".12"/></filter><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#327de2"/></marker></defs>
<rect width="960" height="680" rx="18" fill="url(#bg)"/>
<text x="49" y="71" fill="#3879d5" font-size="18" letter-spacing="2.5" font-weight="700" font-family="Arial,sans-serif">DIFF-AWARE ARCHITECTURE REVIEW</text>
<text x="49" y="151" fill="#0c2348" font-size="64" font-weight="700" font-family="Arial,sans-serif">PatchCourt</text>
<text x="49" y="195" fill="#445a77" font-size="23" font-family="Arial,sans-serif">What did this patch change in the architecture?</text>
