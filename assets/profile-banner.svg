<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="title desc">
  <title id="title">Artem Shelenko — C++ Software Engineer</title>
  <desc id="desc">Midnight-blue banner with circuit illustration and Build, Measure, Improve motto.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1224"/>
      <stop offset="0.6" stop-color="#0e1d30"/>
      <stop offset="1" stop-color="#091929"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#86a3bd" stroke-width="0.65" opacity="0.12"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="1280" height="330" rx="20" fill="url(#bg)" />
  <rect x="0" y="0" width="1280" height="330" rx="20" fill="url(#grid)" />
  <rect x="0.75" y="0.75" width="1278.5" height="328.5" rx="19" fill="none" stroke="#35546a" stroke-width="1.5" opacity="0.7"/>
  <path d="M48 57H115" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <text x="129" y="63" fill="#9bb3c9" font-size="19" font-family="DejaVu Sans, Arial, sans-serif" letter-spacing="3">ENGINEER / BUILDER</text>
  <text x="48" y="145" fill="#f1f7fc" font-size="64" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" letter-spacing="1">ARTEM SHELENKO</text>
  <text x="50" y="193" fill="#54d6c8" font-size="24" font-weight="600" font-family="DejaVu Sans, Arial, sans-serif" letter-spacing="3">C++ SOFTWARE ENGINEER</text>
  <text x="50" y="266" fill="#b8cad9" font-size="20" font-family="DejaVu Sans, Arial, sans-serif" letter-spacing="1.2">BUILD  /  MEASURE  /  IMPROVE</text>
  <path d="M48 289H686" stroke="#7898ad" stroke-width="1" opacity="0.35" />
  <g transform="translate(963,163)">
