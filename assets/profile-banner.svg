    <circle r="108" fill="none" stroke="#61a9b2" stroke-width="1.5" stroke-dasharray="3 9" opacity="0.32"/>
    <circle r="73" fill="none" stroke="#427891" stroke-width="1.5" opacity="0.55"/>
    <rect x="-43" y="-43" width="86" height="86" rx="12" fill="#0e2d3b" stroke="#55d5c7" stroke-width="2" />
    <rect x="-26" y="-26" width="52" height="52" rx="6" fill="#103a49" stroke="#69e0c2" stroke-width="1.3"/>
    <text x="0" y="8" fill="#effffb" text-anchor="middle" font-size="23" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif">C++</text>
    <path d="M-43 -26H-73V-66H-116 M43 -26H81V-72H119 M-43 27H-77V71H-120 M43 27H72V85H113" stroke="url(#line)" stroke-width="2" fill="none" opacity="0.8" />
    <path d="M-22 -43V-70H-45V-102 M22 -43V-77H42V-116 M-22 43V78H-40V108 M22 43V66H54V116" stroke="url(#line)" stroke-width="2" fill="none" opacity="0.8" />
    <g fill="#4de0c5">
      <circle cx="-116" cy="-66" r="5"/><circle cx="119" cy="-72" r="5"/>
      <circle cx="-120" cy="71" r="5"/><circle cx="113" cy="85" r="5"/>
      <circle cx="-45" cy="-102" r="4"/><circle cx="42" cy="-116" r="4"/>
      <circle cx="-40" cy="108" r="4"/><circle cx="54" cy="116" r="4"/>
    </g>
